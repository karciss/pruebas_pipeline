name: Deploy pagina estatica en pages
on: 
  #cuando se hace push
  push:
    #rama main
    branches: ["main"]
  #ejecutar manualmente desde la ventana de github actions
  workflow_dispatch:

permissions:
  #permisos necesarios para que github actiones escriba en el despliegue en consola 
  contents: read
  id-token: write
  pages: write
 

#solo permite un despliegue a la vez
concurrency:
  group: "deploy-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      #1 revision de codigos y archivos
      - name: Checkout
        uses: actions/checkout@v6

       #2 preparacion de github pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      #3 carga de archivos a github pages
      - name: Carga artifact
        uses: actions/upload-pages-artifact@v4
        with:
          #carpeta donde esta la web (index.html)
          path: '.'

      #desplegar los archivos en github pages
      - name: Desplegar en github pages
        id: deployment
        uses: actions/deploy-pages@v4
